name: Build Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential clang cmake curl flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev python3 zip

      - name: Download Clang
        run: git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 clang-llvm

      - name: Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          # Adiciona tanto o diretório pai quanto o filho ao PATH
          export CLANG_ROOT=$(pwd)/clang-llvm
          export CLANG_BIN=$(find $CLANG_ROOT -name "clang" -exec dirname {} \;)
          export PATH=$CLANG_BIN:$PATH
          
          # Copie seu arquivo de config
          cp Droidspaces_topaz_defconfig_FIXED arch/arm64/configs/gki_defconfig
          
          # Desative o BTF e outros debugs
          scripts/config --file arch/arm64/configs/gki_defconfig \
            --disable DEBUG_INFO_BTF \
            --disable DEBUG_INFO \
            --disable KASAN
          
          make gki_defconfig
          # Força o uso do ld.lld explicitamente
          make -j$(nproc) LLVM=1 LLVM_IAS=1 LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image
