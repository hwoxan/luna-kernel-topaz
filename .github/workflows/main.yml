name: Build Kernel LUNA Topaz
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential clang cmake curl flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev python3 zip llvm lld

      - name: Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 1. Base oficial GKI
          make gki_defconfig
          
          # 2. Mescla os drivers específicos da Xiaomi Topaz para evitar o Bootloop
          if [ -f arch/arm64/configs/vendor/topaz_GKI.config ]; then
            scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/topaz_GKI.config
          fi
          
          # 3. Injeta suporte total ao Droidspaces
          scripts/config --file .config \
            --enable MACVLAN \
            --enable IP6_NF_NAT \
            --enable IP6_NF_TARGET_MASQUERADE \
            --enable CFS_BANDWIDTH \
            --enable CGROUP_PIDS \
            --enable USER_NS \
            --enable PID_NS \
            --enable TUN \
            --enable FUSE_FS \
            --enable OVERLAY_FS \
            --disable DEBUG_INFO_BTF \
            --disable DEBUG_INFO \
            --disable KASAN
          
          # 4. Finaliza a configuração e compila
          make olddefconfig
          make -j$(nproc) LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image
